[package]
name = "soundesti-plugin-host"
description = "Hosts third-party VST2, VST3 and CLAP plugins: scanning, loading, audio, MIDI, state and editor windows."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
soundesti-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
libloading = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
