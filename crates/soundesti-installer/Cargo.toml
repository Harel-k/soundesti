[package]
name = "soundesti-installer"
description = "Soundesti Installer Wizard: install, repair, force update, modify and uninstall."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "soundesti-setup"
path = "src/main.rs"

[dependencies]
soundesti-updater = { path = "../soundesti-updater" }
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Threading"] }
