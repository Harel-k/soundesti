[package]
name = "soundesti-app"
description = "Soundesti desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "soundesti"
path = "src/main.rs"

[dependencies]
soundesti-audio.workspace = true
soundesti-audio-device.workspace = true
soundesti-commands.workspace = true
soundesti-dsp.workspace = true
soundesti-export.workspace = true
soundesti-plugin-api.workspace = true
soundesti-project.workspace = true
soundesti-session.workspace = true
soundesti-shortcuts.workspace = true
soundesti-synthesis.workspace = true
soundesti-effects.workspace = true
soundesti-timeline.workspace = true
soundesti-updater = { path = "../soundesti-updater" }
# Same version eframe already uses (PNG encoding for the MCP screenshot tool).
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
