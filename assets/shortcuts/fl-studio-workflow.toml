# Soundesti shortcut profile: "FL Studio Workflow"
#
# Every binding below is transcribed from the official FL Studio manual's shortcut page:
#   https://www.image-line.com/fl-studio-learning-content/fl-studio-online-manual/html/basics_shortcuts.htm
# (fetched 2026-10-24). `section` names the manual table each entry came from.
# Bindings the manual does not document are NOT added here; Soundesti-only extras live
# in a separate profile so this preset never silently diverges from FL behaviour.
#
# Contexts: global, channel_rack, piano_roll, playlist, mixer, browser.
# A focused window's context is tried first, then global.
# Key names: A-Z, 0-9, F1-F12, Num0-Num9, Num+, Num-, Num*, Num/, Space, Enter, Esc,
# Tab, Backspace, Del, Ins, Home, End, PgUp, PgDown, Up, Down, Left, Right.

name = "FL Studio Workflow"
source = "https://www.image-line.com/fl-studio-learning-content/fl-studio-online-manual/html/basics_shortcuts.htm"

bindings = [
  # --- Global Shortcuts ---
  { ctx = "global", keys = "Ctrl+Z", cmd = "edit.undo_toggle", section = "Global" },
  { ctx = "global", keys = "Ctrl+Alt+Z", cmd = "edit.undo_step", section = "Global" },

